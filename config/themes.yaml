# A-share themes / sectors registry
# ----------------------------------
# Used by /picks (Stage 1 候选池构建) and as upstream signals in /analyze.
#
# Each theme provides:
#   - id, name_zh, description, keywords (for search)
#   - layers: supply-chain layers (upstream -> downstream), conceptual
#   - representative_tickers: concrete A-share tickers per theme/layer
#     This is the candidate-pool seed. Maintain manually; add新 tickers when
#     a sector matures or new themes emerge.
#
# Each ticker tagged with the layer it occupies for chokepoint mapping.

